name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get Version
        id: get_version
        run: echo "VERSION=$(grep 'project.version=' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Recreate signing keystore from secret (if configured)
        shell: bash
        run: |
          if [ -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "::notice::SIGNING_KEY secret 未配置，跳过签名 Release 构建，仅构建 Debug。"
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > androidApp/release.jks
          fi

      - name: Build Android
        if: env.SKIP_RELEASE != 'true'
        env:
          SIGNING_KEY: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
        run: |
          ./gradlew :androidApp:assembleRelease
          cp androidApp/build/outputs/apk/release/androidApp-release.apk UBAA-Android-v${{ steps.get_version.outputs.VERSION }}.apk

      - name: Upload Android Release Assets
        if: env.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: UBAA-Android-v${{ steps.get_version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get Version
        id: get_version
        run: echo "VERSION=$(grep 'project.version=' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Build iOS Framework
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

      # 上传 iOS 框架（给 Xcode 工程嵌入使用，非用户安装包）
      - name: Archive iOS Framework
        run: |
          zip -r UBAA-iOS-Framework-v${{ steps.get_version.outputs.VERSION }}.zip composeApp/build/bin/iosArm64/releaseFramework

      - name: Upload iOS Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: UBAA-iOS-Framework-v${{ steps.get_version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
